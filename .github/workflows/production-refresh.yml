# Set repository variable DASHBOARD_URL (e.g. https://your-dashboard.example.com)
# and add the same URL to GITHUB_OIDC_AUDIENCES on the server.
name: Production data refresh (manual fallback)

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: production-data-refresh
  cancel-in-progress: false

jobs:
  refresh-and-verify:
    runs-on: ubuntu-slim
    timeout-minutes: 4
    steps:
      - name: Refresh and verify production
        env:
          OIDC_AUDIENCE: ${{ vars.DASHBOARD_URL }}
          REFRESH_URL: ${{ vars.DASHBOARD_URL }}/api/cron/refresh?mode=full&walletBudget=3
          STATUS_URL: ${{ vars.DASHBOARD_URL }}/api/status
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          umask 077

          refresh_file="$(mktemp)"
          status_file="$(mktemp)"
          trap 'rm -f "$refresh_file" "$status_file"' EXIT

          encoded_audience="$(node -p 'encodeURIComponent(process.argv[1])' "$OIDC_AUDIENCE")"
          oidc_response="$(
            curl --silent --show-error --fail \
              --connect-timeout 10 --max-time 20 \
              --header "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
              "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${encoded_audience}"
          )"
          oidc_token="$(
            printf '%s' "$oidc_response" | node -e '
              let input = "";
              process.stdin.setEncoding("utf8");
              process.stdin.on("data", (chunk) => { input += chunk; });
              process.stdin.on("end", () => {
                const value = JSON.parse(input).value;
                if (typeof value !== "string" || !value) process.exit(1);
                process.stdout.write(value);
              });
            '
          )"
          test -n "$oidc_token"
          echo "::add-mask::$oidc_token"

          refresh_code="$(
            curl --silent --show-error \
              --connect-timeout 10 --max-time 90 \
              --output "$refresh_file" --write-out "%{http_code}" \
              --request POST \
              --header "Authorization: Bearer ${oidc_token}" \
              --header "X-Idempotency-Key: github-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
              "$REFRESH_URL"
          )"
          test "$refresh_code" -ge 200 -a "$refresh_code" -lt 300

          node - "$refresh_file" <<'NODE'
          const fs = require("node:fs");
          const body = JSON.parse(fs.readFileSync(process.argv[2], "utf8"));
          const skipped = body.ran === "skipped" && body.reason === "refresh_in_progress";
          if (!skipped && (body.ok !== true || !["ok", "partial"].includes(body.refreshStatus))) {
            throw new Error("production refresh did not return a usable status");
          }
          console.log(
            skipped
              ? "refresh=skipped reason=already-running"
              : `refresh=${body.refreshStatus} wallets=${body.walletOk}/${body.walletTotal}`
          );
          NODE

          status_code="$(
            curl --silent --show-error \
              --connect-timeout 10 --max-time 20 \
              --output "$status_file" --write-out "%{http_code}" \
              --header "Authorization: Bearer ${oidc_token}" \
              "$STATUS_URL"
          )"
          test "$status_code" -eq 200

          node - "$status_file" <<'NODE'
          const fs = require("node:fs");
          const body = JSON.parse(fs.readFileSync(process.argv[2], "utf8"));
          if (body.ok !== true || !Number.isInteger(body.walletCount) || body.walletCount < 1) {
            throw new Error("unexpected production status");
          }
          if (typeof body.refreshAgeSeconds !== "number" || body.refreshAgeSeconds > 900) {
            throw new Error("production data is older than 15 minutes");
          }
          if (!Number.isInteger(body.snapshotCount) || body.snapshotCount < 1) {
            throw new Error("production snapshots are missing");
          }
          if (body.walletsStale > 0) {
            console.log(`::warning::${body.walletsStale} wallets have been stale for more than three hours`);
          }
          if (body.walletsLive < body.walletCount) {
            console.log(`::warning::only ${body.walletsLive}/${body.walletCount} wallets updated in the last ten minutes`);
          }
          console.log(
            `status=healthy snapshots=${body.snapshotCount} live=${body.walletsLive} stale=${body.walletsStale}`
          );
          NODE
